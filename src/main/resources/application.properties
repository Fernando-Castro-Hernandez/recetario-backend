spring.application.name=recetario-backend

# Perfil activo: carga application-dev.properties (credenciales, ignorado por Git)
spring.profiles.active=dev

# Las tablas las crea Flyway (db/migration). Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
